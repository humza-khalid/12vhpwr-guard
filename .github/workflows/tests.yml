name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Windows only: the guard imports ctypes.wintypes at module scope, so the
    # test suite cannot even be collected anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q tests
